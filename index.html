<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <title>Private Project</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: Canvas;
      color: CanvasText;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
    }

    main {
      width: min(38rem, calc(100% - 3rem));
      padding: 3rem 0;
    }

    p {
      max-width: 34rem;
      line-height: 1.65;
    }

    .label {
      color: GrayText;
      font-size: 0.875rem;
      text-transform: uppercase;
    }

    h1 {
      margin: 0.5rem 0 1.25rem;
      font-size: clamp(2rem, 8vw, 3.25rem);
      line-height: 1.1;
    }

    a {
      color: LinkText;
    }
  </style>
</head>
<body>
  <main>
    <p class="label">Private project</p>
    <h1>Internal testing only</h1>
    <p>This project is private and currently in internal testing. It is not offered or made available for public use.</p>
    <p>No public access, registration, or support is provided.</p>
    <p><a href="./privacy.html">Privacy notice</a></p>
  </main>
</body>
</html>
