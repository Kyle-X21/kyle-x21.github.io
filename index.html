<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <title>Page Directory</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="page directory">
    <header class="topbar">
      <p class="identity"><span class="identity-mark" aria-hidden="true"></span>Page directory</p>
      <p class="state">Link index</p>
    </header>

    <main class="content">
      <section class="copy" aria-labelledby="page-title">
        <p class="kicker">Available pages</p>
        <h1 id="page-title">A small directory</h1>
        <p class="summary">This page contains links to other pages.</p>
        <a class="action" href="./private-project/">Open linked page</a>
      </section>

      <div class="art" aria-hidden="true">
        <span class="art-panel"></span>
        <span class="art-line art-line-one"></span>
        <span class="art-line art-line-two"></span>
      </div>
    </main>

    <footer class="footer">
      <p>Page directory</p>
      <p>Links only</p>
    </footer>
  </div>
</body>
</html>
